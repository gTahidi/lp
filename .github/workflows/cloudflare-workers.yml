name: Cloudflare Workers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Note that automatic deployment is not configured
        if: github.event_name == 'push' && vars.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo 'Cloudflare deployment skipped. Set the repository variable and API token described in README.md.' >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.CLOUDFLARE_ACCOUNT_ID != ''))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Configure the repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure the repository variable}"
          npm exec --yes --package=cf@1.0.0-rc.6 -- cf deploy ./dist
